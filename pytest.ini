[pytest]
# importlib mode is required because multiple apps share the same internal
# package names (ingestion/, retrieval/, generation/). With importlib mode,
# pytest imports each test module by its filesystem path rather than by its
# dotted module name, preventing collection-phase collisions.
#
# IMPORTANT: run tests per-app, not all at once from the repo root.
# Per-app (the CI style):
#   pytest -q basic_rag/simple_rag_chain/tests
#   pytest -q agentic_rag/tool_use_rag/tests
#   pytest -q local_rag/ollama_rag/tests
#   pytest -q rag_as_a_service/api_service/tests
# Running plain `pytest` from the repo root will fail because the same-named
# internal packages (e.g. `ingestion.loader`) collide across apps at runtime.
addopts = --import-mode=importlib
