name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install -r basic_rag/simple_rag_chain/requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        pytest -q basic_rag/simple_rag_chain/tests